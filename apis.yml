name: Storytree
description: >-
  Storytree Inc. is a Palo Alto consumer photo company, backed by 500 Global,
  that operates SimplePrints (simpleprints.com, formerly getsimpleprints.com) —
  a mobile-first service that turns the photos on your phone into physical
  products: layflat and mini photo books, canvas prints, metal prints and metal
  desk prints, photo cards, and wall calendars. The app pulls images directly
  from the phone with no exporting or reformatting, and the business adds a
  referral program, promotional discounts, and a schools program. SimplePrints
  is a business-to-consumer mobile app and does NOT publish a developer API,
  SDKs, OpenAPI, or a developer portal. The one machine-consumable surface it
  exposes is a Wix-hosted llms.txt and a generic Wix Site MCP endpoint for
  agentic access to public site content (business details, site search, and a
  bridge to Wix business-solution APIs).
